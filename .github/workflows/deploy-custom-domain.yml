# Deploy to Custom Domain (goldeneyeco.com)
name: Deploy to Custom Domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Custom domain (e.g., goldeneyeco.com)'
        required: true
        default: 'goldeneyeco.com'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-custom-domain"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: goldeneye/package-lock.json
          
      - name: Create CNAME file
        run: |
          echo "${{ github.event.inputs.domain }}" > goldeneye/public/CNAME
          
      - name: Install dependencies
        run: |
          cd goldeneye
          npm install
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
          
      - name: Build with Next.js (Custom Domain)
        env:
          CUSTOM_DOMAIN: true
        run: |
          cd goldeneye
          npm run build
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: goldeneye/out

  deploy:
    environment:
      name: github-pages
      url: https://${{ github.event.inputs.domain }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 